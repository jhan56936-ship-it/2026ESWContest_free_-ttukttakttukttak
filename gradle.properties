# 한글 경로(바탕 화면) 체크를 우회하기 위한 설정 (필수)
android.overridePathCheck=true

# 프로젝트 소스코드 및 리소스 인코딩 설정
systemProp.file.encoding=UTF-8

# AndroidX 지원 활성화
android.useAndroidX=true
# 이전 서포트 라이브러리와 AndroidX 호환성 자동 매핑 활성화
android.enableJetifier=true

# 빌드에 사용할 자바(JDK) 위치.
# Gradle 8.6 + AGP 8.4 조합은 JDK 17 이 필요합니다.
# Android Studio 가 번들한 최신 JBR(Java 25)로 돌리면
# "Unsupported class file major version 69" 오류가 나며 빌드가 실패합니다.
org.gradle.java.home=/Users/gimjihan/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# 배포용 APK 서명 정보는 keystore.properties 파일에 따로 두었습니다.
# (비밀번호가 저장소에 올라가지 않도록 분리한 것입니다. 자세한 내용은 README 참고)

# Gradle 빌드 성능을 최적화하기 위한 JVM 설정
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
