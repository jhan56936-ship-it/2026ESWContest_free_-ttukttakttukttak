plugins {
    id 'com.android.application'
}

// 배포용 APK 서명 정보를 읽어 옵니다.
// 비밀번호가 저장소에 올라가지 않도록 keystore.properties 에 따로 두었습니다.
// 이 파일이 없으면 서명 없이 빌드되며, 개발용(debug) 빌드는 영향받지 않습니다.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasSigningKey = keystoreProperties.containsKey('storeFile') &&
        file(keystoreProperties['storeFile']).exists()

android {
    namespace 'com.example.vibekey'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.vibekey"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "3.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 제미나이 API 키를 gradle.properties(GEMINI_API_KEY)에 넣어두면 기본값으로 주입됩니다.
        // 값이 없으면 앱 안의 "설정" 화면에서 직접 입력할 수 있습니다.
        buildConfigField "String", "DEFAULT_GEMINI_API_KEY",
                "\"${project.findProperty('GEMINI_API_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    // 배포용 APK 서명 설정 (키 파일과 비밀번호는 절대 공유하지 마세요)
    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            // 안드로이드 클래스를 건드리는 호출이 있으면 조용히 넘기지 말고 바로 알리게 둡니다.
            returnDefaultValues = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 키가 준비돼 있을 때만 서명합니다. (키가 없어도 빌드는 되게)
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // UI 스타일링에 사용된 CardView 라이브러리
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // USB Serial 통신을 위한 핵심 라이브러리 (요청하신 v3.8.0)
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'

    // --- 테스트 ---
    // 순수 자바 로직 검증용 (기기 없이 ./gradlew test 로 바로 실행)
    testImplementation 'junit:junit:4.13.2'
    // android.jar 의 org.json 은 단위 테스트에서 비어 있으므로 진짜 구현체를 넣어 줍니다.
    testImplementation 'org.json:json:20231013'

    // 기기/에뮬레이터에서 도는 계측 테스트용
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}

// Android Studio sync 오류(prepareKotlinBuildScriptModel)를 해결하기 위한 더미 태스크
tasks.register("prepareKotlinBuildScriptModel") {}
