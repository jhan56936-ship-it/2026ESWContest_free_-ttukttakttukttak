    (function () {

      var tl = gsap.timeline({ paused: true });

      function draw(sel, at, dur, ease) {
        var el = document.querySelector(sel);
        if (!el) return;
        var len = el.getTotalLength ? el.getTotalLength() : 1000;
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });

      /* ---- Scene 1 (0.0–4.0) : 기기가 배경으로 물러나고 축이 그려진다 ---- */

      /* ---- Scene 2 (4.0–9.0) : 정거장 6개가 waterfall 로 ---- */

      for (var i = 0; i < 6; i++) {
        var travel = i === 0 ? 36 : 26;

        tl.to("#in-n" + i, { y: 0, duration: dur, ease: "power4.out" }, t);
        tl.fromTo("#in-s" + i, { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, t + 0.12);
        t = t + dur + 0.42;

      /* ---- Scene 3 (9.0–14.0) : 점 하나가 정거장을 지나간다 ---- */

      var stops = [150, 440, 730, 1020, 1310, 1600, 1770];
      var lights = ["#in-n0", "#in-n1", "#in-n2", "#in-n3", "#in-n4", "#in-n5"];

      for (var k = 0; k < 6; k++) {
        tl.to("#in-dot", { attr: { cx: stops[k] }, duration: 0.32, ease: "power2.inOut" }, at);
        tl.to(lights[k], { borderColor: "#0B57D0", backgroundColor: "rgba(11,87,208,0.14)", duration: 0.2, ease: "power2.out" }, at + 0.26);

          draw("#in-dirty", at - 1.55, 0.6);
          tl.to("#in-dirty", { opacity: 1, duration: 0.2, ease: "power2.out" }, at - 1.55);
          draw("#in-clean", at - 0.85, 0.55);
          tl.to("#in-clean", { opacity: 1, duration: 0.2, ease: "power2.out" }, at - 0.85);
