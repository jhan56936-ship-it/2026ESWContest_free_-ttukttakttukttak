  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* 한 번의 누름: 눌림 → 링 확산 → 폰 흔들림 → 화면 교체 */
      function press(at, btn, ring, name, from, to, accent) {
        /* press-release-spring: 빠르게 눌리고 탄성으로 돌아온다 */
        tl.to(btn, { scale: 0.86, duration: 0.09, ease: "power2.in", transformOrigin: "50% 50%" }, at);
        tl.to(btn, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, at + 0.09);
        /* cursor-click-ripple 응용: 링이 퍼지며 옅어진다 */
        tl.fromTo(ring, { opacity: 0.9, scale: 1, transformOrigin: "50% 50%" }, { opacity: 0, scale: 2.4, duration: 0.75, ease: "power2.out" }, at + 0.05);
        tl.fromTo(name, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, at + 0.2);
        /* 폰이 짧게 흔들린다 — 진동은 폰이 한다 */
        tl.to("#po-phone", { x: 7, duration: 0.05, ease: "none" }, at + 0.62);
        tl.to("#po-phone", { x: -6, duration: 0.05, ease: "none" }, at + 0.67);
        tl.to("#po-phone", { x: 4, duration: 0.05, ease: "none" }, at + 0.72);
        tl.to("#po-phone", { x: 0, duration: 0.08, ease: "power2.out" }, at + 0.77);
        /* scale-swap-transition: 나가는 쪽은 축소+블러, 들어오는 쪽은 확대에서 안착 */
        tl.to(from, { autoAlpha: 0, scale: 0.94, filter: "blur(7px)", duration: 0.24, ease: "power2.in", transformOrigin: "50% 42%" }, at + 0.80);
        tl.fromTo(to, { autoAlpha: 0, scale: 1.07, filter: "blur(9px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.46, ease: "power3.out", transformOrigin: "50% 42%" }, at + 1.04);
        tl.fromTo("#po-badge", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, at + 1.0);
        tl.set("#po-badge", { color: accent }, at + 1.0);
      }

      /* ---- Scene 1 (0.0–3.0) : 2분할과 폰 홈 ---- */
      tl.fromTo("#po-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo("#po-divider", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.inOut" }, 0.3);
      tl.fromTo("#po-phone", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.5);
      tl.fromTo("#po-btn1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 1.0);
      tl.fromTo("#po-btn2", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 1.2);
      tl.fromTo("#po-btn3", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 1.4);

      /* ---- Scene 2 (3.0–10.0) : 1번 → 전화 ---- */
      press(3.4, "#po-btn1", "#po-ring1", "#po-name1", "#po-home", "#po-dial", "#0B57D0");
      tl.fromTo("#po-caption", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.2);

      /* ---- Scene 3 (10.0–17.0) : 2번 → 문자. 같은 리듬 ---- */
      press(10.6, "#po-btn2", "#po-ring2", "#po-name2", "#po-dial", "#po-sms", "#12703A");

      /* ---- Scene 4 (17.0–23.0) : 3번 → 길찾기. 0.2초 빠르게 ---- */
      press(17.6, "#po-btn3", "#po-ring3", "#po-name3", "#po-sms", "#po-map", "#B26A00");

      /* ---- Scene 5 (23.0–26.0) : 홈으로 돌아오고 세 앱이 남는다 ---- */
      tl.to("#po-badge", { opacity: 0, duration: 0.3, ease: "power2.in" }, 22.9);
      tl.to("#po-map", { autoAlpha: 0, scale: 0.94, filter: "blur(7px)", duration: 0.26, ease: "power2.in", transformOrigin: "50% 42%" }, 23.1);
      tl.fromTo("#po-done", { autoAlpha: 0, scale: 1.06, filter: "blur(9px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.52, ease: "power3.out", transformOrigin: "50% 42%" }, 23.4);

      window.__timelines["03-press-opens"] = tl;
    })();
