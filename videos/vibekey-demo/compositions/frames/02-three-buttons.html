  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* svg-path-draw: 각 path 의 실제 길이를 재서 dash 로 그린다 */
      function draw(sel, at, dur, ease) {
        var el = document.querySelector(sel);
        if (!el) return;
        var len = el.getTotalLength ? el.getTotalLength() : 1200;
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
      }

      /* ---- Scene 1 (0.0–4.0) : 기기 외곽선이 한 획으로 그려진다 ---- */
      draw("#tb-board", 0.2, 1.5);
      draw("#tb-usb", 1.4, 0.5);
      draw("#tb-mcu", 1.7, 0.6);
      tl.fromTo("#tb-mculabel", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.3);
      draw("#tb-b1", 2.3, 0.4);
      draw("#tb-b2", 2.5, 0.4);
      draw("#tb-b3", 2.7, 0.4);

      /* ---- Scene 2 (4.0–7.0) : 워드마크 ---- */

      tl.fromTo("#tb-wordmark", { opacity: 0, y: 34, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "back.out(1.5)" }, 4.5);

      /* ---- Scene 3 (7.0–12.0) : 버튼 점등 → 지시선 → 라벨 ---- */

        { fill: "#tb-f2", lead: "#tb-l2", chip: "#tb-chip2", at: 7.55 },
        { fill: "#tb-f3", lead: "#tb-l3", chip: "#tb-chip3", at: 7.9 }
      ];
      for (var i = 0; i < slots.length; i++) {
        var s = slots[i];
        tl.fromTo(s.fill, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, s.at);
        draw(s.lead, s.at + 0.3, 0.65);
        tl.fromTo(s.chip, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, s.at + 0.85);
      }
      tl.fromTo("#tb-note", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 9.6);

      /* ---- Scene 4 (12.0–18.0) : 케이블이 그려지고 빛이 기기→폰 방향으로 흐른다 ---- */

      draw("#tb-phone", 12.7, 0.9);
      tl.set("#tb-flow", { opacity: 1, strokeDasharray: "90 268", strokeDashoffset: 358 }, 13.8);
      tl.to("#tb-flow", { strokeDashoffset: -90, duration: 1.1, ease: "power2.inOut" }, 13.8);
      tl.to("#tb-flow", { opacity: 0, duration: 0.3, ease: "power1.out" }, 14.9);
      tl.fromTo("#tb-usbnote", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 14.6);
