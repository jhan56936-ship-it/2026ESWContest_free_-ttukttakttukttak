      var tl = gsap.timeline({ paused: true });

      var SPEC = [

      tl.fromTo("#nu-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);

      /* ---- Scene 2 (3.0–11.0) : 카드가 0.6초 간격, 숫자는 counting-dynamic-scale ---- */
      for (var i = 0; i < SPEC.length; i++) {
        (function (s, idx) {
          var at = 3.0 + idx * 0.6;
          var el = document.getElementById(s.id);
          var unit = '<span>' + s.unit + '</span>';
          var proxy = { v: 0 };
          tl.fromTo("#nu-c" + idx,
            { opacity: 0, y: 30, scale: 0.96, transformOrigin: "50% 50%" },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, at);
          tl.to(proxy, {
            v: s.to, duration: 1.5, ease: "power2.out",
            onUpdate: function () {
              var n = Math.round(proxy.v);
              el.innerHTML = (s.comma ? n.toLocaleString("en-US") : String(n)) + unit;
            }
          }, at + 0.18);
          /* 다 세고 나면 살짝 커졌다 안착 — 도착을 몸으로 알린다 */

          tl.to("#nu-v" + idx, { scale: 1, duration: 0.34, ease: "power2.inOut", transformOrigin: "0% 50%" }, at + 1.85);
        })(SPEC[i], i);
