  <div id="root" data-composition-id="07-crc-reject" data-start="0" data-duration="18" data-width="1920" data-height="1080">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var stage = document.getElementById("cr-stage");
      /* particle-burst 용 파편 */
      var SPARKS = 16;
      for (var p = 0; p < SPARKS; p++) {
        var d = document.createElement("div");
        d.className = "cr-spark";
        d.id = "cr-spark-" + p;
        d.style.left = "1212px";
        d.style.top = "484px";
        stage.appendChild(d);
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–4.0) : 프레임이 기기에서 출발한다 ---- */
      tl.fromTo("#cr-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo("#cr-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.45);
      tl.fromTo("#cr-dev", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.1);
      tl.fromTo("#cr-phone", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.3);
      tl.fromTo("#cr-pkt", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.1);
      tl.to("#cr-pkt", { x: 210, duration: 1.4, ease: "none" }, 2.7);

      /* ---- Scene 2 (4.0–8.0) : 비트가 뒤집히고, 폰이 버린다 ---- */
      /* chromatic-glitch: 짧고 거칠게, 세 바이트가 적색으로 */
      var bad = ["#cr-by2", "#cr-by4", "#cr-by5"];
      for (var b = 0; b < bad.length; b++) {
        tl.to(bad[b], { color: "#B3261E", borderColor: "#B3261E", backgroundColor: "rgba(179,38,30,0.10)", duration: 0.08, ease: "none" }, 4.1 + b * 0.06);
        tl.to(bad[b], { x: 5, duration: 0.04, ease: "none" }, 4.1 + b * 0.06);
        tl.to(bad[b], { x: -4, duration: 0.04, ease: "none" }, 4.16 + b * 0.06);
        tl.to(bad[b], { x: 0, duration: 0.05, ease: "none" }, 4.22 + b * 0.06);
      }
      tl.set("#cr-by2", { textContent: "F1" }, 4.14);
      tl.set("#cr-by4", { textContent: "6C" }, 4.20);
      tl.to("#cr-pkt", { x: 546, duration: 1.5, ease: "none" }, 4.4);
      /* 폰에 닿는 순간 판정 */
      tl.set("#cr-badge", { color: "#B3261E", textContent: "✕ CRC 불일치" }, 5.9);
      tl.fromTo("#cr-badge", { opacity: 0, y: 16, scale: 0.94, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "back.out(2)" }, 5.9);
      /* particle-burst: 프레임이 흩어져 사라진다 */
      tl.to("#cr-pkt", { opacity: 0, scale: 0.9, duration: 0.28, ease: "power2.in", transformOrigin: "50% 50%" }, 6.25);
      for (var q = 0; q < SPARKS; q++) {
        var ang = (Math.PI * 2 * q) / SPARKS;
        tl.set("#cr-spark-" + q, { opacity: 1, x: 0, y: 0, scale: 1 }, 6.25);
        tl.to("#cr-spark-" + q, {
          x: Math.cos(ang) * (150 + (q % 4) * 26),
          y: Math.sin(ang) * (110 + (q % 3) * 22),
          scale: 0.2, opacity: 0, duration: 0.75, ease: "power3.out"
        }, 6.25);
      }
      /* 폰 화면은 그대로다 — 이게 요점 */

      /* ---- Scene 3 (8.0–13.0) : 재전송, 이번엔 통과 ---- */
      tl.fromTo("#cr-retry", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 8.2);
      tl.to("#cr-badge", { opacity: 0, duration: 0.3, ease: "power2.in" }, 8.6);
      /* 손상 흔적을 지우고 원래 값으로 되돌린 뒤 다시 출발 */
      tl.set(["#cr-by2", "#cr-by4", "#cr-by5"], { color: "#0B57D0", borderColor: "rgba(11,87,208,0.28)", backgroundColor: "rgba(11,87,208,0.06)" }, 9.0);
      tl.set("#cr-by2", { textContent: "01" }, 9.0);
      tl.set("#cr-by4", { textContent: "B1" }, 9.0);
      tl.set("#cr-pkt", { x: 0, scale: 1 }, 9.0);
      tl.to("#cr-pkt", { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.05);
      tl.to("#cr-pkt", { x: 546, duration: 2.0, ease: "none" }, 9.4);
      tl.set("#cr-badge", { color: "#0B57D0", textContent: "✓ CRC 일치" }, 11.5);
      tl.fromTo("#cr-badge", { opacity: 0, y: 16, scale: 0.94, transformOrigin: "50% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, 11.5);
      /* 그제서야 폰이 반응한다 */
      tl.to("#cr-screen", { backgroundColor: "rgba(11,87,208,0.16)", borderColor: "#0B57D0", color: "#0B57D0", duration: 0.35, ease: "power2.out" }, 11.85);
      tl.set("#cr-screen", { textContent: "전화 열림" }, 11.9);
      tl.to("#cr-phone", { x: 6, duration: 0.05, ease: "none" }, 11.85);
      tl.to("#cr-phone", { x: -5, duration: 0.05, ease: "none" }, 11.9);
      tl.to("#cr-phone", { x: 0, duration: 0.07, ease: "power2.out" }, 11.96);

      /* ---- Scene 4 (13.0–18.0) : 근거 ---- */
      tl.fromTo("#cr-evidence", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 13.4);

      window.__timelines["07-crc-reject"] = tl;
    })();
  </script>
