<template>
  <style>
    @font-face { font-family: "Gothic A1"; src: url("assets/fonts/GothicA1-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: "Gothic A1"; src: url("assets/fonts/GothicA1-Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: block; }
    @font-face { font-family: "Gothic A1"; src: url("assets/fonts/GothicA1-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: "Gothic A1"; src: url("assets/fonts/GothicA1-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: block; }
    @font-face { font-family: "Noto Sans KR"; src: url("assets/fonts/NotoSansKR.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }

    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

    .w01-bg { position: absolute; inset: 0; background: #F7F9FC; }

    .w01-stage { position: absolute; inset: 0; }

    /* 폰 목업 — 씬 1~3의 주인공 */
    .w01-phone {
      position: absolute; left: 760px; top: 88px; width: 400px; height: 720px;
      border-radius: 44px; background: #FFFFFF;
      border: 3px solid rgba(16, 20, 24, 0.16);
      opacity: 0;
    }
    .w01-notch {
      position: absolute; left: 150px; top: 18px; width: 100px; height: 16px;
      border-radius: 100px; background: rgba(16, 20, 24, 0.14);
    }
    .w01-grid {
      position: absolute; left: 30px; top: 62px; width: 340px;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px 12px;
    }
    .w01-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; }
    .w01-icon { width: 48px; height: 48px; border-radius: 12px; }
    .w01-label {
      font-family: "Noto Sans KR", sans-serif; font-weight: 400; font-size: 9px;
      color: #41505E; white-space: nowrap; letter-spacing: -0.02em;
      filter: blur(var(--w01-dof, 0px)); will-change: filter;
    }

    /* 손가락 — 도형으로만. 사진 아님 */
    .w01-finger {
      position: absolute; left: 892px; top: 900px; width: 136px; height: 300px;
      opacity: 0;
    }
    .w01-finger-tip {
      position: absolute; left: 30px; top: 0; width: 76px; height: 108px;
      border-radius: 38px 38px 22px 22px; background: #101418; opacity: 0.9;
    }
    .w01-finger-body {
      position: absolute; left: 8px; top: 84px; width: 120px; height: 216px;
      border-radius: 56px 56px 0 0; background: #101418; opacity: 0.9;
    }

    /* 왼쪽 텍스트 — 씬 3 */
    .w01-copy { position: absolute; left: 120px; top: 300px; width: 560px; }
    .w01-eyebrow {
      font-family: "Gothic A1", sans-serif; font-weight: 600; font-size: 22px;
      letter-spacing: 0.08em; color: #0B57D0; margin-bottom: 26px; opacity: 0;
    }
    .w01-line { font-family: "Gothic A1", sans-serif; font-weight: 600; font-size: 62px; line-height: 1.18; letter-spacing: -0.02em; color: #101418; opacity: 0; }
    .w01-line em { font-style: normal; color: #0B57D0; }

    /* 씬 4 — 잉크 면과 마지막 문장 */
    .w01-ink { position: absolute; left: 0; top: 1080px; width: 1920px; height: 1080px; background: #101418; }
    .w01-final {
      position: absolute; left: 0; top: 392px; width: 1920px; text-align: center;
      font-family: "Gothic A1", sans-serif; font-weight: 700; font-size: 84px;
      line-height: 1.14; letter-spacing: -0.025em; color: #F7F9FC; opacity: 0;
    }
    .w01-final b { font-weight: 700; color: #6FA8F5; }
  </style>

  <div id="root" data-composition-id="01-wall" data-start="0" data-duration="22" data-width="1920" data-height="1080">
    <div id="w01-bg" class="clip w01-bg" data-start="0" data-duration="16.2" data-track-index="0"></div>

    <div id="w01-stage" class="clip w01-stage" data-start="0" data-duration="16.2" data-track-index="1">
      <div class="w01-phone" id="w01-phone">
        <div class="w01-notch"></div>
        <div class="w01-grid" id="w01-grid"></div>
      </div>

      <div class="w01-finger" id="w01-finger">
        <div class="w01-finger-tip"></div>
        <div class="w01-finger-body"></div>
      </div>

      <div class="w01-copy">
        <div class="w01-eyebrow" id="w01-eyebrow">그 앞에서 멈춘다</div>
        <div class="w01-line" id="w01-line-a">전화 한 통 거는 데</div>
        <div class="w01-line" id="w01-line-b">화면 <em>세 번</em>, 아이콘 <em>스무 개</em>.</div>
      </div>

    </div>

    <div id="w01-close" class="clip w01-stage" data-start="15" data-duration="7" data-track-index="2">
      <div class="w01-ink" id="w01-ink"></div>
      <div class="w01-final" id="w01-final">익숙하지 않은 사람에게<br /><b>그건 벽입니다.</b></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var LABELS = [
        "전화", "메시지", "카메라", "사진", "설정",
        "지도", "날씨", "달력", "시계", "계산기",
        "은행", "카드", "메일", "메모", "건강",
        "음악", "영상", "장터", "지갑", "파일"
      ];
      var TINTS = [
        "rgba(11,87,208,0.62)", "rgba(11,87,208,0.30)", "rgba(16,20,24,0.30)",
        "rgba(11,87,208,0.44)", "rgba(16,20,24,0.20)", "rgba(11,87,208,0.22)"
      ];
      var grid = document.getElementById("w01-grid");
      for (var i = 0; i < LABELS.length; i++) {
        var cell = document.createElement("div");
        cell.className = "w01-cell";
        cell.id = "w01-cell-" + i;
        var ico = document.createElement("div");
        ico.className = "w01-icon";
        ico.style.background = TINTS[i % TINTS.length];
        var lab = document.createElement("div");
        lab.className = "w01-label";
        lab.textContent = LABELS[i];
        cell.appendChild(ico);
        cell.appendChild(lab);
        grid.appendChild(cell);
      }

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 60;

      /* ---- Scene 1 (0.0–5.0) : 폰과 격자만. waterfall-entry 로 위에서부터 ---- */
      tl.fromTo("#w01-phone", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);

      var t = 0.75;
      for (var r = 0; r < LABELS.length; r++) {
        /* 무거운 첫 행은 멀리·길게, 뒤로 갈수록 간격이 줄고 마지막은 스냅 */
        var heavy = r < 5;
        var travel = heavy ? 34 : (r < 15 ? 26 : 20);
        var dur = heavy ? 0.19 : (r < 15 ? 0.155 : 0.125);
        tl.set("#w01-cell-" + r, { opacity: 1, y: travel }, t);
        tl.to("#w01-cell-" + r, { y: 0, duration: dur, ease: "power4.out" }, t);
        t = t + dur - (r < 5 ? -2 * F : F);
      }

      /* ---- Scene 2 (5.0–10.0) : 손가락이 올라와 멈추고, 그대로 내려간다 ---- */
      tl.fromTo("#w01-finger", { opacity: 0, y: 0 }, { opacity: 1, y: -190, duration: 1.5, ease: "power3.out" }, 5.0);
      tl.to("#w01-finger", { y: -206, duration: 0.5, ease: "sine.out" }, 6.5);
      /* 1.5초 멈춤 — 아무것도 눌리지 않는다 */
      tl.to("#w01-finger", { y: 40, opacity: 0, duration: 1.2, ease: "power2.in" }, 8.5);

      /* ---- Scene 3 (10.0–15.0) : 이름이 흐려지고, 왼쪽에 문장이 온다 ---- */
      for (var b = 0; b < LABELS.length; b++) {
        tl.to("#w01-cell-" + b + " .w01-label", { "--w01-dof": "3.4px", duration: 0.7, ease: "power2.inOut" }, 10.0 + b * 0.08);
      }
      tl.to("#w01-phone", { x: 210, duration: 1.6, ease: "power3.inOut" }, 10.4);
      tl.fromTo("#w01-eyebrow", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.0);
      tl.fromTo("#w01-line-a", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 11.5);
      tl.fromTo("#w01-line-b", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 12.5);

      /* ---- Scene 4 (15.0–22.0) : 잉크 면이 올라오고 마지막 문장만 남는다 ---- */
      tl.to("#w01-ink", { y: -1080, duration: 1.0, ease: "power3.inOut" }, 15.1);
      /* 덮이는 동안 아래 내용을 함께 걷어 낸다 — 어두운 면 위에 어두운 글자가 남지 않도록 */
      tl.to("#w01-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, 15.2);
      tl.fromTo("#w01-final", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 16.6);
      /* 17.5초 이후 완전 정지 — 이 정적이 다음 프레임의 등장을 만든다 */

      window.__timelines["01-wall"] = tl;
    })();
  </script>
</template>
