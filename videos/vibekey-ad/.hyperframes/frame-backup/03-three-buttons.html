  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      /* ── Scene 1 (0.0–1.4s) — the board body rises and sits ──────────────
         spring-pop-entrance, overshoot deliberately weak. Hero on screen
         well before t = 0.5s. */
      tl.fromTo(
        "#f03-device",
        { y: 90, scale: 0.94, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.78, ease: "back.out(1.05)" },
        0.08
      );

      /* chrome settles quietly under the entrance */
      tl.fromTo(
        ".f03-topbar > *",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.45, stagger: 0.06 },
        0.18
      );

      /* the board assembles: trim + usb arrive after the body has landed */
      tl.fromTo(
        "#f03-detail",
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.34 },
        0.95
      );

      tl.fromTo(
        ".f03-meta > *",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, stagger: 0.08 },
        1.0
      );

      /* ── Scene 2 (1.4–2.3s) — three separate beats, 0.25s apart ──────────
         1 cobalt → 2 green → 3 amber. Three strikes is what makes the
         viewer count three; together they would read as one pattern. */
      var buttons = ["#f03-btn1", "#f03-btn2", "#f03-btn3"];
      for (var i = 0; i < buttons.length; i++) {
        tl.fromTo(
          buttons[i],
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.3)" },
          1.4 + i * 0.25
        );
      }

      /* ── Scene 3 (2.3–3.6s) — the colour stems draw downward ─────────────
         svg-path-draw: stroke-dashoffset 34 → 0, same order as the buttons.
         This is the recurring "this button = this app" link. */
      var stems = ["#f03-stem1", "#f03-stem2", "#f03-stem3"];
      for (var s = 0; s < stems.length; s++) {
        tl.fromTo(
          stems[s],
          { strokeDashoffset: 34 },
          { strokeDashoffset: 0, duration: 0.55, ease: "power3.out" },
          2.35 + s * 0.2
        );
      }

      /* ── Scene 4 (3.6–5.0s) — the line lands, then everything stops ──────
         HELD FRAME: no drift, no breathing, no idle float after this. */
      tl.fromTo(
        "#f03-headline",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        3.56
      );

      /* hold the landed state out to the full 5.0s */
      tl.set("#f03-headline", { opacity: 1 }, 5.0);

      window.__timelines["03-three-buttons"] = tl;
    })();
  </script>
