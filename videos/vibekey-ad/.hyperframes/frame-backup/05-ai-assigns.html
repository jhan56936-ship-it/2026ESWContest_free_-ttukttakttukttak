  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0-1.4s) — the surface is already held (its own screen is
         scrolling into the settled result under us). The entrance is carried
         beside it: the claim lands, then the little product board. */
      tl.fromTo(
        "#f05-head",
        { opacity: 0, y: 26, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.5)" },
        0.28,
      );
      tl.fromTo(
        "#f05-board",
        { opacity: 0, y: -22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.62,
      );

      /* Scenes 2-4 — each row is pulled OUT of the phone and stood up large.
         Every card starts life at its row's position and size inside the
         screen (335.5 / 580 = 0.5784) and grows into place; a same-coloured
         tab stays behind on the bezel at that row's height, and the matching
         button on the product board lights up. */
      var pulls = [
        { card: "#f05-card1", tab: "#f05-tab1", btn: "#f05-b1", why: "#f05-why1", x: 574, y: -151.0, t: 1.42 },
        { card: "#f05-card2", tab: "#f05-tab2", btn: "#f05-b2", why: "#f05-why2", x: -574, y: 141.9, t: 3.02 },
        { card: "#f05-card3", tab: "#f05-tab3", btn: "#f05-b3", why: "#f05-why3", x: -574, y: -113.4, t: 4.42 },
      ];
      pulls.forEach(function (p) {
        tl.fromTo(
          p.tab,
          { opacity: 0, scaleY: 0.35 },
          { opacity: 1, scaleY: 1, duration: 0.34, ease: "power2.out" },
          p.t,
        );
        tl.fromTo(
          p.btn,
          { opacity: 0.2 },
          { opacity: 1, duration: 0.34, ease: "power1.out" },
          p.t + 0.08,
        );
        tl.fromTo(
          p.card,
          { x: p.x, y: p.y, scale: 0.5784, opacity: 0 },
          { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.82, ease: "power3.out" },
          p.t + 0.13,
        );
        tl.fromTo(
          p.why,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          p.t + 1.03,
        );
      });

      /* Scene 5 (5.6-7.0s) — svg-path-draw: one same-coloured line per card,
         drawn from the card's edge to the phone's outer edge, landing on the
         bezel tab of the row it came from, 0.15s apart. Length is measured,
         never guessed. Then the shot rests. */
      var draws = [
        { id: "#f05-l1", dots: ["#f05-d1a", "#f05-d1b"], at: 5.62 },
        { id: "#f05-l2", dots: ["#f05-d2a", "#f05-d2b"], at: 5.77 },
        { id: "#f05-l3", dots: ["#f05-d3a", "#f05-d3b"], at: 5.92 },
      ];
      draws.forEach(function (d) {
        var path = document.querySelector(d.id);
        var len = 180;
        if (path && typeof path.getTotalLength === "function") {
          try {
            len = path.getTotalLength() * 1.02;
          } catch (e) {
            len = 180;
          }
          path.style.strokeDasharray = String(len);
          path.style.strokeDashoffset = String(len);
        }
        tl.fromTo(
          d.id,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
          d.at,
        );
        tl.fromTo(
          d.dots,
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power1.out" },
          d.at + 0.43,
        );
      });

      window.__timelines["05-ai-assigns"] = tl;
    })();
