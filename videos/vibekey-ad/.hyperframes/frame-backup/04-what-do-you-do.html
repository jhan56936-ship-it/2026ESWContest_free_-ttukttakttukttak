  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var ID = "04-what-do-you-do";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (sel) {
        return root ? root.querySelectorAll(sel) : document.querySelectorAll(sel);
      };
      var one = function (sel) {
        return root ? root.querySelector(sel) : document.querySelector(sel);
      };

      var tl = gsap.timeline({ paused: true });

      var stage = one("#wdyd-stage");
      var chrome = one(".wdyd-chrome");
      var h1 = one("#wdyd-h1");
      var h2 = one("#wdyd-h2");
      var sub = one("#wdyd-sub");
      var names = q(".wdyd-name");
      var dots = q(".wdyd-dot");
      var plates = q(".wdyd-plate");
      var slab = document.querySelector(".wdyd-slab");

      /* ---------- Scene 1 (0.0-1.6s) ----------
         원래는 폰 전체가 오른쪽에서 미끄러져 들어왔다. 그런데 화면 안의 진짜 녹화는
         조립 단계에서 최상위로 올라가고 그 좌표가 고정되기 때문에, 기기틀만 움직이면
         틀과 화면이 어긋난다. 그래서 폰은 처음부터 제자리에 두고, 뒤에 깔린 판(slab)이
         밀려 들어오면서 등장을 만든다. nudge-curve 의 느리게-빠르게-느리게는 그대로다. */
      tl.fromTo(
        slab,
        { x: 240, autoAlpha: 0 },
        { x: 216, autoAlpha: 1, duration: 0.23, ease: "power3.in" },
        0
      );
      tl.fromTo(
        slab,
        { x: 216 },
        { x: 60, duration: 0.21, ease: "none", immediateRender: false },
        0.23
      );
      tl.fromTo(
        slab,
        { x: 60 },
        { x: 0, duration: 0.71, ease: "power4.out", immediateRender: false },
        0.44
      );

      tl.fromTo(
        chrome,
        { y: 14, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" },
        0.2
      );

      /* ---------- Scene 2 (1.6-3.0s) — the line lands on the left; on the phone face
         the first function (전화 걸기) is checked at 1.83s and the ladder answers. ---------- */
      tl.fromTo(
        h1,
        { y: 42, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.52, ease: "power3.out" },
        1.55
      );
      tl.fromTo(
        h2,
        { y: 42, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.52, ease: "power3.out" },
        1.67
      );
      tl.fromTo(
        sub,
        { y: 24, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.42, ease: "power3.out" },
        1.88
      );

      /* ---------- the colour ladder — one row per check, in the recording's own order.
         전화 걸기 = #0B57D0 (1번) · 길 찾기 = #12703A (2번) · 사진 보기 = #B26A00 (3번).
         Scene 2 seeds row 1; Scene 3 (3.0-5.2s) stacks rows 2 and 3. ---------- */
      var rowAt = [2.45, 3.49, 4.94];
      for (var i = 0; i < rowAt.length; i++) {
        tl.fromTo(
          names[i],
          { x: -36, autoAlpha: 0 },
          { x: 0, autoAlpha: 1, duration: 0.46, ease: "power3.out" },
          rowAt[i]
        );
        tl.fromTo(
          dots[i],
          { scale: 0, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.42, ease: "power3.out" },
          rowAt[i] + 0.04
        );
      }

      /* ---------- Scene 4 (5.2-7.5s) — the phone reads "3가지를 고르셨어요";
         the three rows brighten together once, then settle. Still from 6.17s. ---------- */
      tl.fromTo(
        plates,
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power2.out" },
        5.4
      );
      tl.fromTo(
        plates,
        { opacity: 1 },
        {
          opacity: 0.55,
          duration: 0.55,
          ease: "power3.out",
          immediateRender: false
        },
        5.62
      );
      tl.fromTo(
        dots,
        { scale: 1 },
        {
          scale: 1.22,
          duration: 0.22,
          ease: "power2.out",
          immediateRender: false
        },
        5.4
      );
      tl.fromTo(
        dots,
        { scale: 1.22 },
        {
          scale: 1,
          duration: 0.55,
          ease: "power3.out",
          immediateRender: false
        },
        5.62
      );

      window.__timelines[ID] = tl;
    })();
