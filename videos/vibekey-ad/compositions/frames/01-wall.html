  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- baked geometry (deterministic, read from the asset itself) ----------
         The wall box is 1990 x 1697.8 at left -35 / top -308.9, so its centre sits
         exactly on the canvas centre (960, 540) and 1 svg user unit = S px. */
      var WALL_L = -35;
      var WALL_T = -308.9;
      var S = 1990 / 1008;
      var CX = 960;
      var CY = 540;

      var wall = document.querySelector("#wall01-wall");
      var tiles = Array.prototype.slice.call(
        document.querySelectorAll("#wall01-svg > g[id]")
      );

      var data = tiles.map(function (el) {
        var r = el.querySelector("rect");
        var rx = parseFloat(r.getAttribute("x"));
        var ry = parseFloat(r.getAttribute("y"));
        var ux = rx + 60;
        var uy = ry + 60;
        var px = WALL_L + ux * S;
        var py = WALL_T + uy * S;
        var dx = px - CX;
        var dy = py - CY;
        return {
          el: el,
          ux: ux,
          uy: uy,
          col: Math.round(rx / 148),
          row: Math.round(ry / 148),
          dx: dx,
          dy: dy,
          dist: Math.sqrt(dx * dx + dy * dy)
        };
      });

      /* ---------- center-outward-expansion, run outward: every tile's edge
         resting offset is baked ONCE onto the element, then tweened from 0. ----------
         Whichever normalised axis dominates decides the side it is swept to, so the
         grid opens up/down/left/right instead of collapsing into a ring. The numbers
         guarantee the cleared centre: no tile centre may sit inside
         |dx| < 738.5 AND |dy| < 318.5, which keeps the sentence on bare cream. */
      var CLEAR_X = 738.5;
      var CLEAR_Y = 318.5;
      var REST_X = 880;
      var REST_Y = 500;
      var MIN_PUSH = 140;

      data.forEach(function (t) {
        var ax = Math.abs(t.dx) / CLEAR_X;
        var ay = Math.abs(t.dy) / CLEAR_Y;
        var tx = t.dx;
        var ty = t.dy;
        if (ay >= ax) {
          ty = (t.dy < 0 ? -1 : 1) * Math.max(Math.abs(t.dy) + MIN_PUSH, REST_Y);
        } else {
          tx = (t.dx < 0 ? -1 : 1) * Math.max(Math.abs(t.dx) + MIN_PUSH, REST_X);
        }
        t.tx = (tx - t.dx) / S;
        t.ty = (ty - t.dy) / S;
        t.el.setAttribute("data-target-x", t.tx.toFixed(2));
        t.el.setAttribute("data-target-y", t.ty.toFixed(2));
      });

      /* ---------- Scene 1 (0.0-1.8s) — the wall fills in, one row at a time,
         in index order. spring-pop-entrance: scale 0 -> 1 on power3.out, no
         overshoot. Row 0 bleeds off the top edge, so it shares row 1's beat —
         that keeps the FIRST ROW THE VIEWER CAN SEE landing by t = 0.5s. ---------- */
      var POP_DUR = 0.42;
      var ROW_STAGGER = 0.12;
      var COL_STAGGER = 0.014;

      data.forEach(function (t) {
        var origin = t.ux + " " + t.uy;
        tl.fromTo(
          t.el,
          { scale: 0, opacity: 0, svgOrigin: origin },
          {
            scale: 1,
            opacity: 1,
            svgOrigin: origin,
            duration: POP_DUR,
            ease: "power3.out"
          },
          Math.max(0, t.row - 1) * ROW_STAGGER + t.col * COL_STAGGER
        );
      });

      /* ---------- Scene 2 (1.8-3.2s) — the grid eases back. 1.087 -> 1.0 is the
         1.0 -> 0.92 pull-back; the wall still bleeds off all four edges at the end,
         so no cream gutter opens up. multi-phase-camera, phase 1. ---------- */
      tl.fromTo(
        wall,
        { scale: 1.087 },
        { scale: 1.0, duration: 1.4, ease: "power1.inOut" },
        1.8
      );

      /* ---------- Scene 3 (3.2-4.5s) — the shove.
         The camera reverses into a short push-in and the tiles are swept out at the
         SAME timeline position, so the shove reads as caused by it. ---------- */
      tl.fromTo(
        wall,
        { scale: 1.0 },
        {
          scale: 1.035,
          duration: 0.55,
          ease: "power3.out",
          immediateRender: false
        },
        3.2
      );

      var order = data.slice().sort(function (a, b) {
        return a.dist - b.dist || a.row - b.row || a.col - b.col;
      });
      order.forEach(function (t, i) {
        tl.fromTo(
          t.el,
          { x: 0, y: 0 },
          {
            x: t.tx,
            y: t.ty,
            duration: 0.95,
            ease: "power3.out",
            immediateRender: false
          },
          3.2 + i * 0.008
        );
      });

      /* ---------- Scene 4 (4.5-5.53s) — the sentence stands up in two beats.
         waterfall-entry: binary opacity, one direction (from below), anchors travel
         furthest and settle longest, each fragment starting before the last lands.
         Line 2 arrives 0.6s after line 1 — reading pace, not a queue. ---------- */
      var F = 1 / 60;
      var t1 = 4.5;
      var t2 = t1 + 0.19 + 2 * F;
      var t3 = 5.1;
      var t4 = t3 + 0.12 - F;
      var t5 = t4 + 0.15 - F;

      var words = [
        { id: "#wall01-w1", at: t1, y: 76, d: 0.19 },
        { id: "#wall01-w2", at: t2, y: 46, d: 0.15 },
        { id: "#wall01-w3", at: t3, y: 40, d: 0.12 },
        { id: "#wall01-w4", at: t4, y: 46, d: 0.15 },
        { id: "#wall01-w5", at: t5, y: 78, d: 0.19 }
      ];

      words.forEach(function (w) {
        var el = document.querySelector(w.id);
        if (!el) return;
        tl.fromTo(
          el,
          { opacity: 0 },
          { opacity: 1, duration: 0.001, ease: "none" },
          w.at
        );
        tl.fromTo(
          el,
          { y: w.y },
          { y: 0, duration: w.d, ease: "power4.out" },
          w.at
        );
      });

      /* the last ~0.97s is dead still — the frame is there to be read. */
      tl.set(wall, { opacity: 1 }, 6.5);

      window.__timelines["01-wall"] = tl;
    })();
  </script>
