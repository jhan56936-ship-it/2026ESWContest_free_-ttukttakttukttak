<template>
  <style>
    /* ── embedded faces (files on disk, never fetched) ───────────────── */
    @font-face {

    /* ── frame root (id, never a class — subcomposition_root_styled_by_class) */
    #root {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Gothic A1", "Noto Sans KR", sans-serif;
      color: #101418;
      -webkit-font-smoothing: antialiased;
    }

    /* full-bleed ground rides on its own clip layer, never on #root */
    #pg-ground {
      position: absolute;
      inset: 0;
      background: #F7F9FC;
    }
    #pg-stage {
      position: absolute;
      inset: 0;
    }

    /* ── chrome: mono section label (technical-artifact register) ────── */
    #pg-label {
      position: absolute;
      left: 64px;
      top: 48px;
      font-family: "JetBrains Mono", monospace;
      font-size: 1.25cqw;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: #101418;
    }

    /* ── the device (inlined assets/device-board.svg, 360x150 -> 780x325) */
    #pg-board {
      position: absolute;
      left: 570px;
      top: 172px;
    }

    /* ── the flat presser: one broad plane, not a finger ─────────────── */
    #pg-press {
      position: absolute;
      left: 650px;
      top: 213px;
      width: 620px;
      height: 46px;
      background: #ADCBFB;
      border: 5px solid #101418;
      opacity: 0;
    }

    /* ── the signal chunk: three simultaneous presses bundled as one ─── */
    #pg-rail {
      position: absolute;
      left: 0;
      top: 292px;
      width: 1920px;
      height: 64px;
      transform-origin: 960px 32px;
    }
    .pg-chip {
      position: absolute;
      top: 0;
      width: 64px;
      height: 64px;
      border: 4px solid #F7F9FC;
      opacity: 0;
    }
    #pg-chip1 { left: 668px; background: #0B57D0; }
    #pg-chip2 { left: 928px; background: #12703A; }
    #pg-chip3 { left: 1188px; background: #B26A00; }

    /* ── the device's own edge, turning the signal back ─────────────── */
    #pg-guard {
      position: absolute;
      left: 1330px;
      top: 210px;
      width: 12px;
      height: 227px;
      background: #B3261E;
      opacity: 0;
      transform-origin: 50% 50%;
    }

    /* ── the mark left where it died ─────────────────────────────────── */
    #pg-x {
      position: absolute;
      left: 1372px;
      top: 259px;
      width: 130px;
      height: 130px;
      background: #F7F9FC;
      border: 5px solid #101418;
      box-shadow: 0.95cqw 0.95cqw 0 #101418;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    /* ── the two closing beats ───────────────────────────────────────── */
    .pg-line {
      position: absolute;
      left: 96px;
      width: 1728px;
      text-align: center;
      font-family: "Gothic A1", "Noto Sans KR", sans-serif;
      font-weight: 800;
      font-size: 6cqw;
      line-height: 0.92;
      letter-spacing: -0.01em;
      color: #101418;
    }
    #pg-line1 { top: 588px; }
    #pg-line2 { top: 720px; opacity: 0; }
    .pg-word {
      display: inline-block;
      opacity: 0;
    }
    #pg-accent {
      position: relative;
      color: #0B57D0;
    }
    #pg-ul {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.13em;
      height: 0.085em;
      background: #0B57D0;
      transform-origin: 0% 50%;
      opacity: 0;
    }
  </style>

  <div
    id="root"
    data-composition-id="08-pocket-guard"
    data-start="0"
    data-duration="5"
    data-width="1920"
    data-height="1080"
  >
    <div id="pg-ground" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>

    <div id="pg-stage" class="clip" data-start="0" data-duration="5" data-track-index="1">
      <div id="pg-label">POCKET GUARD</div>

      <!-- assets/device-board.svg, inlined verbatim (ids prefixed for the assembled doc) -->
      <svg
        id="pg-board"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 360 150"
        width="780"
        height="325"
        role="img"
        aria-label="바이브키 기기"
      >
        <g id="pg-shadow" opacity="0.10">
          <rect x="9" y="23" width="350" height="106" rx="20" fill="#000000" />
        </g>
        <rect id="pg-body" x="5" y="15" width="350" height="110" rx="20" fill="#1E293B" stroke="#475569" stroke-width="3" />
        <rect id="pg-trim" x="100" y="28" width="160" height="12" fill="#334155" />
        <rect id="pg-usb" x="160" y="125" width="40" height="20" rx="6" fill="#94A3B8" />
        <g id="pg-btn1">
          <circle cx="60" cy="70" r="30" fill="#0B57D0" stroke="#083F9B" stroke-width="3" />
          <circle cx="60" cy="70" r="12" fill="#FFFFFF" opacity="0.4" />
        </g>
        <g id="pg-btn2">
          <circle cx="180" cy="70" r="30" fill="#12703A" stroke="#0B4F27" stroke-width="3" />
          <circle cx="180" cy="70" r="12" fill="#FFFFFF" opacity="0.4" />
        </g>
        <g id="pg-btn3">
          <circle cx="300" cy="70" r="30" fill="#B26A00" stroke="#8A5200" stroke-width="3" />
          <circle cx="300" cy="70" r="12" fill="#FFFFFF" opacity="0.4" />
        </g>
      </svg>

      <div id="pg-press"></div>

      <div id="pg-rail">
        <div id="pg-chip1" class="pg-chip"></div>
        <div id="pg-chip2" class="pg-chip"></div>
        <div id="pg-chip3" class="pg-chip"></div>
      </div>

      <div id="pg-guard"></div>

      <div id="pg-x">
        <svg viewBox="0 0 100 100" width="100" height="100" aria-hidden="true">
          <line x1="22" y1="22" x2="78" y2="78" stroke="#B3261E" stroke-width="14" stroke-linecap="butt" />
          <line x1="78" y1="22" x2="22" y2="78" stroke="#B3261E" stroke-width="14" stroke-linecap="butt" />
        </svg>
      </div>

      <div id="pg-line1" class="pg-line">
        <span class="pg-word">주머니에서</span> <span class="pg-word">눌린</span> <span class="pg-word">것은</span>
      </div>

      <div id="pg-line2" class="pg-line">
        <span id="pg-accent">기기가<b id="pg-ul"></b></span> 먼저 걸러 냅니다
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* one tempo grid drives every onset (kinetic-beat-slam) */
      var PULSE = 0.325;
      var B = [];
      for (var i = 0; i < 12; i++) B.push(+(PULSE * i).toFixed(3));

      /* ── Scene 1 (0.0–1.3s) — the device, then three buttons at once ── */

      /* hero is on screen well before 0.5s, via fromTo (never CSS-hidden) */
      tl.fromTo(
        "#pg-board",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "power3.out", transformOrigin: "50% 50%" },
        0
      );
      tl.fromTo(
        "#pg-label",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
        0.13
      );

      /* one broad flat plane comes down across all three buttons */
      tl.fromTo(
        "#pg-press",
        { y: -260, opacity: 0 },
        { y: 0, opacity: 1, duration: PULSE, ease: "power2.in" },
        B[1]
      );

      /* press-release-spring: linear compression, then the spring back.
         RELEASE_START == PRESS_START + PRESS_DUR (adjacent, or the spring snaps) */
      var PRESS_START = B[2];
      var PRESS_DUR = 0.15;
      var RELEASE_START = PRESS_START + PRESS_DUR;
      var btns = ["#pg-btn1", "#pg-btn2", "#pg-btn3"];

      btns.forEach(function (sel) {
        tl.to(
          sel,
          { scale: 0.84, duration: PRESS_DUR, ease: "power1.in", transformOrigin: "50% 50%" },
          PRESS_START
        );
        tl.to(
          sel,
          { scale: 1, duration: 0.3, ease: "back.out(1.9)", transformOrigin: "50% 50%" },
          RELEASE_START
        );
      });
      tl.to("#pg-press", { y: 10, duration: PRESS_DUR, ease: "power1.in" }, PRESS_START);
      tl.to("#pg-press", { y: 0, duration: 0.18, ease: "power2.out" }, RELEASE_START);

      /* three colours fire on the SAME frame — no stagger; that is the point */
      var chips = ["#pg-chip1", "#pg-chip2", "#pg-chip3"];
      chips.forEach(function (sel) {
        tl.fromTo(
          sel,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.26, ease: "power3.out", transformOrigin: "50% 50%" },
          RELEASE_START
        );
      });

      /* the plane lifts away again */
      tl.to("#pg-press", { y: -260, opacity: 0, duration: 0.34, ease: "power2.in" }, B[3]);

      /* ── Scene 2 (1.3–2.6s) — the signal goes out, the edge turns it back ── */

      /* the three presses gather into ONE contiguous chunk */
      tl.to("#pg-chip1", { x: 196, duration: 0.32, ease: "power2.inOut" }, B[4]);
      tl.to("#pg-chip3", { x: -196, duration: 0.32, ease: "power2.inOut" }, B[4]);

      /* it accelerates outward, trying to leave */
      var TRAVEL = 262;
      var IMPACT = B[5] + 0.42;
      tl.to("#pg-rail", { x: TRAVEL, duration: 0.42, ease: "power2.in" }, B[5]);

      /* the device's own edge snaps shut */
      tl.fromTo(
        "#pg-guard",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.1, ease: "power3.out" },
        IMPACT
      );

      /* the outward trajectory kinks at the edge and dies */
      tl.to("#pg-rail", { x: TRAVEL + 14, duration: 0.07, ease: "none" }, IMPACT);
      tl.to(
        "#pg-rail",
        {
          x: 168,
          y: 104,
          rotation: -16,
          scale: 0.12,
          opacity: 0,
          duration: 0.3,
          ease: "power2.in",
          transformOrigin: "960px 32px"
        },
        IMPACT + 0.07
      );

      /* stamped once, at the spot */
      tl.fromTo(
        "#pg-x",
        { scale: 0, opacity: 0, rotation: -4 },
        { scale: 1, opacity: 1, rotation: -4, duration: 0.3, ease: "power3.out", transformOrigin: "50% 50%" },
        B[7]
      );
      tl.to("#pg-guard", { opacity: 0, duration: 0.22, ease: "power2.in" }, 2.47);
      tl.to("#pg-x", { opacity: 0, scale: 0.94, duration: 0.26, ease: "power2.in" }, 2.9);

      /* ── Scene 3 (2.6–5.0s) — two beats, distinct entrances ────────── */

      /* beat 1: per-word rise */
      gsap.utils.toArray("#pg-line1 .pg-word").forEach(function (el, i) {
        tl.fromTo(
          el,
          { y: 46, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
          B[8] + i * 0.07
        );
      });

      /* beat 2: whole-line slam (a different entrance, same tempo grid) */
      var LINE2_AT = 3.2;
      tl.fromTo(
        "#pg-line2",
        { scale: 1.18, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.3, ease: "power4.out", transformOrigin: "50% 50%" },
        LINE2_AT
      );

      /* the one accent move: cobalt underline drawn left to right under 기기가 */
      tl.fromTo(
        "#pg-ul",
        { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.22, ease: "power2.out" },
        LINE2_AT + 0.16
      );

      /* 3.58s → 5.0s: dead still. no exit — the root transition is the exit. */

      window.__timelines["08-pocket-guard"] = tl;
    })();
  </script>
</template>
