    #f06-stage { position: absolute; inset: 0; }

    .f06-ring {

    #f06-link {

    /* ---- the two screen bezels. Each border ring sits entirely OUTSIDE its

    .f06-bezel {

      box-sizing: border-box; background: #F7F9FC;

    /* A — Scene 1/2, clip rect 1262,148 317x644 */
    #f06-bezelA { left: 1254px; top: 140px; width: 333px; height: 660px; }

  </style>

      <video id="f06-clipB" src="assets/clip-press.mp4" muted playsinline preload="auto"

  <script>
    (function () {
      // Real moments inside clip-press.mp4, played at real time (the hoist drops
      // data-playback-rate), so source seconds == frame seconds for clip A and
      // clip B alike (B's data-media-start equals its data-start):
      //   0.00–1.03 home · 1.03–1.20 the tap lands · 1.20–3.30 the "1번 버튼"
      //   dialog · 3.30–3.95 dismiss · 3.95–4.60 launch flash · 4.60–5.20 the
      //   Phone app draws in · 5.20–7.20 fully rendered, then the tail still.
      var TCUT = 3.3; // the punch-in: small rect -> large rect, one hard cut
      var T4 = 5.4;
      var PULSE = 0.5;
      var BEATS = [T4, T4 + PULSE];

      var tl = gsap.timeline({ paused: true });

      /* ---------- Scene 1 (0.00–1.20) — the physical press ---------- */
      // press-release-spring: linear compression, spring release at exactly
      // PRESS_START + PRESS_DUR so the two tweens thread their state.
      tl.fromTo("#f06-btn1", { y: 0, scale: 1 },
        { y: 8, scale: 0.88, duration: 0.14, ease: "power1.in" }, 0.36);
      tl.to("#f06-btn1", { y: 0, scale: 1, duration: 0.52, ease: "back.out(2.2)" }, 0.5);

      // one cobalt bloom spreading from btn1 on the release (flat rings, no glow)
      tl.fromTo("#f06-ring1", { scale: 0.35, opacity: 1 },
        { scale: 3.6, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 0.5);
      tl.fromTo("#f06-ring2", { scale: 0.35, opacity: 0.8 },
        { scale: 2.3, opacity: 0, duration: 0.66, ease: "power2.out", immediateRender: false }, 0.64);

      tl.fromTo("#f06-badge", { scale: 0.6, rotation: -16, opacity: 0 },
        { scale: 1, rotation: -4, opacity: 1, duration: 0.46, ease: "back.out(1.9)", immediateRender: false }, 0.62);

      tl.fromTo("#f06-chrome", { y: -14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.06);

      /* ---------- Scene 2 (1.20–3.30) — the bloom crosses, the dialog lands ---------- */
      // 목적지에 opacity 를 반드시 적는다. 콜드 렌더 워커는 CSS 에 적힌 숨김 상태
      // (opacity:0) 를 되살리기 때문에, 목적지에 없으면 렌더에서만 안 보인다.
      tl.fromTo("#f06-link", { scaleX: 0, opacity: 1 },
        { scaleX: 1, opacity: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 0.95);
      tl.to("#f06-link", { opacity: 0, duration: 0.34, ease: "power2.in" }, 1.5);
      tl.fromTo("#f06-pulse", { scale: 1, opacity: 0.9 },
        { scale: 1.16, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 1.18);

      // the device hands the shot over before the cut. The hard kill on the
      // 3.30s clip boundary keeps a non-linear seek from restoring stale state.
      tl.to("#f06-left", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 2.25);
      tl.set("#f06-left", { opacity: 0 }, TCUT);

      /* ---------- Scene 3 (3.30–5.40) — the punch-in cut; no text at all ---------- */
      // one-frame bezel swap, timed to the frame where the hoisted clips swap
      // rectangles, so the ink frame always matches the live screen exactly.
      tl.to("#f06-bezelA", { opacity: 0, duration: 0.02, ease: "none" }, TCUT - 0.02);
      tl.set("#f06-bezelA", { opacity: 0 }, TCUT);
      tl.fromTo("#f06-bezelB", { opacity: 0 },
        { opacity: 1, duration: 0.02, ease: "none", immediateRender: false }, TCUT - 0.02);

      /* ---------- Scene 4 (5.40–7.50) — two beats on one pulse grid ---------- */
      tl.fromTo("#f06-w1", { scale: 1.42, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, BEATS[0]);
      tl.fromTo("#f06-w2", { y: 96, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "circ.out", immediateRender: false }, BEATS[1]);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-press-opens"] = tl;
    })();
  </script>
