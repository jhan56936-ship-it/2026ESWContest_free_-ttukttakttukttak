  <script>
    (function () {
      var FRAME_ID = "02-erased";
      var DURATION = 5.5;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      if (!root) return;

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;

      /* ---- one tempo grid drives every beat (kinetic-beat-slam) ---- */
      var PULSE = 0.52;
      var BEAT_CLEAR = 0.1; /* Scene 1 — the leftovers go out */
      var CLEAR_SPAN = PULSE; /* whole stagger bundled inside one pulse */
      var BEAT_SO = PULSE * 5; /* 2.60 — Scene 3, "그래서" */
      var BEAT_HERO = PULSE * 6; /* 3.12 — Scene 3, the slam */
      var BEAT_RULE = PULSE * 8; /* 4.16 — Scene 4, the accent-line draw */

      /* =========================================================
         Scene 1 (0.0-1.2s)
         t=0 is frame 01's landed state: the wall has already been
         shoved to the four edges and is clipped there, centre empty.
         Here it is pushed further out and extinguished tile by tile.
         ========================================================= */
      var CX = 504,
        CY = 430; /* wall centre, svg user units */
      var inner = root.querySelector(".f02-wall-inner");
      var tiles = Array.prototype.slice.call(root.querySelectorAll(".f02-tile"));
      var n = tiles.length;

      /* the shove keeps going underneath the stagger */
      gsap.set(inner, { svgOrigin: "504 430" });
      tl.fromTo(
        inner,
        { scale: 1 },
        { scale: 1.06, duration: 0.95, ease: "power1.out", svgOrigin: "504 430" },
        0
      );

      tiles.forEach(function (g, i) {
        var r = g.querySelector("rect");
        var ox = parseFloat(r.getAttribute("x")) + 60;
        var oy = parseFloat(r.getAttribute("y")) + 60;
        var col = Math.round((ox - 60) / 148);
        var row = Math.round((oy - 60) / 148);

        /* a = inherited edge-clipped position, b = pushed further out */
        var ax, ay, bx, by, dx, dy, m;
        if (col === 0) {
          ax = -20; ay = 175 + row * 100; bx = ax - 150; by = ay;
        } else if (col === 6) {
          ax = 1028; ay = 175 + row * 100; bx = ax + 150; by = ay;
        } else if (row === 0) {
          ax = ox; ay = 128; bx = ax; by = ay - 130;
        } else if (row === 5) {
          ax = ox; ay = 732; bx = ax; by = ay + 130;
        } else {
          /* interior tiles were shoved clean off in frame 01 */
          dx = ox - CX;
          dy = (oy - CY) * 1.35;
          m = Math.sqrt(dx * dx + dy * dy) || 1;
          ax = ox + (dx / m) * 980;
          ay = oy + (dy / m) * 700;
          bx = ax + (dx / m) * 160;
          by = ay + (dy / m) * 120;
        }

        var k = (i * 17) % n; /* deterministic scatter order, no RNG */
        var at = BEAT_CLEAR + (k / (n - 1)) * CLEAR_SPAN;

        gsap.set(g, {
          x: ax - ox, y: ay - oy, scale: 1, opacity: 1, transformOrigin: "50% 50%"
        });
        tl.fromTo(
          g,
          { x: ax - ox, y: ay - oy, scale: 1, opacity: 1, transformOrigin: "50% 50%" },
          {
            x: bx - ox, y: by - oy, scale: 0.84, opacity: 0,
            duration: 0.5, ease: "power2.in"
          },
          at
        );
      });

      /* =========================================================
         Scene 2 (1.2-2.6s) — 1.4s of completely empty cream.
         Nothing is scheduled here on purpose. Do not fill it.
         ========================================================= */

      /* =========================================================
         Scene 3 (2.6-4.0s) — the message lands
         ========================================================= */
      var so = root.querySelector(".f02-so");
      var h1 = root.querySelector(".f02-h1");
      var h2 = root.querySelector(".f02-h2");

      gsap.set([so, h1, h2], { opacity: 0 });

      /* beat 1 — quiet lift */
      tl.fromTo(
        so,
        { opacity: 0, y: 26, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.44, ease: "power4.out" },
        BEAT_SO
      );

      /* beat 2 — the claim slams up from below (a different axis + ease) */
      tl.fromTo(
        h1,
        { opacity: 0, y: 150, scale: 1.12, filter: "blur(14px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.52, ease: "expo.out" },
        BEAT_HERO
      );
      tl.fromTo(
        h2,
        { opacity: 0, y: 172, scale: 1.14, filter: "blur(16px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.56, ease: "expo.out" },
        BEAT_HERO + 0.07
      );

      /* =========================================================
         Scene 4 (4.0-5.5s) — one cobalt accent-line drawn left to right,
         then the frame stops completely (svg-path-draw).
         ========================================================= */
      var rulePath = root.querySelector(".f02-rule-path");
      var len = 60;
      if (rulePath && typeof rulePath.getTotalLength === "function") {
        var measured = rulePath.getTotalLength();
        if (measured > 0) len = measured;
      }
      gsap.set(rulePath, { strokeDasharray: len, strokeDashoffset: len });
      tl.fromTo(
        rulePath,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" },
        BEAT_RULE
      );

      /* hold the frame's full length — no exit, no breath */
      tl.set({}, {}, DURATION);
    })();
  </script>
